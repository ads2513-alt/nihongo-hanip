function readingInfo(q){let entry=READING_MAP[q];if(!entry){let n=sourceHira.indexOf(q);if(n<0)n=sourceKata.indexOf(q);if(n>=0)entry=[q,hiraRoman[n]];}return entry?{kana:entry[0],ko:entry[1]}:null}
function shuffle(xs){for(let i=xs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[xs[i],xs[j]]=[xs[j],xs[i]]}return xs}
function playedAt(){return localDay()}
function dateLocal(iso){const d=new Date(iso);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}

function localDay(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dayAfter(days){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function planReview(key,lesson,q,ok){let p=state.reviewPlan[key]||{stage:0};let stage=ok?Math.min(5,(p.stage||0)+1):0;const intervals=[0,1,3,7,14,30];state.reviewPlan[key]={lesson,q,stage,due:dayAfter(intervals[stage]),last:localDay()}}
function dueItems(){return Object.entries(state.reviewPlan).filter(([key,p])=>p&&Array.isArray(p.q)&&p.due<=localDay()&&lessons.some(l=>l.id===p.lesson)).map(([key,p])=>({key,...p}))}
function startDaily(){let due=dueItems().slice(0,10);let completed=lessons.filter(l=>state.completed[l.id]);let attempted=new Set(state.history.map(h=>h.lesson));let eligible=lessons.filter(l=>state.completed[l.id]||attempted.has(l.id)).flatMap(l=>l.questions.map(q=>({lesson:l.id,q,key:`${l.id}:${q[0]}`})));let marked=new Set(due.map(x=>x.key));let pool=shuffle(eligible.filter(x=>!marked.has(x.key))).slice(0,Math.max(0,10-due.length));let combined=[...due,...pool];if(!combined.length){let first=lessons.find(l=>!state.completed[l.id])||lessons[0];combined=shuffle(first.questions.map(q=>({lesson:first.id,q,key:`${first.id}:${q[0]}`}))).slice(0,10)}startCustom(combined,'오늘의 10문제')}

function start(id,review=false,listen=false){let l=lessons.find(x=>x.id===id);let qs=review?Object.values(state.wrong).filter(x=>x.lesson===id).map(x=>x.q):l.questions;session={id,review,listen,qs:qs.map((q,i)=>({q,key:`${id}:${q[0]}`,options:shuffle([q[1],...q.slice(2)].map((value,k)=>({value,correct:k===0})))})),i:0,correct:0,answered:false};render()};function quiz(){let s=session;if(s.i>=s.qs.length){if(!s.review&&s.correct===s.qs.length)state.completed[s.id]=true;save();return `<section class="card"><h1>🎉 학습 완료!</h1><p>정답 ${s.correct} / ${s.qs.length}문제</p><p>${s.review?'복습 일정에 반영했어요.':s.correct===s.qs.length?'모든 문제를 맞혔어요! 레슨 완료 처리했어요.':'틀린 문제를 다시 익히고 도전해 보세요. 모든 문제를 맞히면 레슨 완료로 인정돼요.'} 정답 XP는 문제별 최초 1회만 지급해요.</p><button class="primary" onclick="session=null;render()">목록으로 돌아가기</button></section>`}let item=s.qs[s.i],q=item.q;return `<section class="card"><div class="row space"><span class="tag">${s.i+1} / ${s.qs.length}</span><span class="muted">${esc(s.title||lessons.find(x=>x.id===s.id)?.title||'복습')}</span></div><h2 style="margin-top:20px">${s.listen?'소리를 듣고 뜻을 골라 보세요':'다음 일본어의 뜻은?'}</h2><div class="bigjp" lang="ja">${s.listen?'🎧 듣기 퀴즈':esc(q[0])}</div><button onclick="speak(${JSON.stringify(q[0]).replace(/"/g,'&quot;')})">🔊 ${s.listen?'문장 듣기':'발음 듣기'}</button><div class="choices">${item.options.map((o,i)=>`<button class="choice" id="c${i}" onclick="answer(${i})">${esc(o.value)}</button>`).join('')}</div><div id="feedback"></div></section>`};function answer(i){let s=session;if(s.answered)return;s.answered=true;let item=s.qs[s.i],ok=item.options[i].correct;if(ok){s.correct++;if(!state.solved)state.solved={};if(!state.solved[item.key]){state.xp+=10;state.solved[item.key]=true}delete state.wrong[item.key]}else state.wrong[item.key]={lesson:s.id,q:item.q};planReview(item.key,item.lesson||s.id,item.q,ok);state.history.push({at:new Date().toISOString(),lesson:item.lesson||s.id,correct:ok});if(state.history.length>2500)state.history=state.history.slice(-2500);save();document.querySelectorAll('.choice').forEach((b,n)=>{b.disabled=true;if(item.options[n].correct)b.classList.add('correct');else if(n===i)b.classList.add('wrong')});let info=readingInfo(item.q[0]);$('feedback').innerHTML=`<div class="note" style="margin-top:16px">${s.listen?`<p lang="ja"><strong>${esc(item.q[0])}</strong></p>`:''}${ok?'✅ 정답!':'💡 정답: '+esc(item.q[1])}${info?`<p class="helper">${esc(info.kana)} · ${esc(info.ko)}</p>`:''}<div style="margin-top:8px"><button onclick="speak('${esc(item.q[0])}',.6)">🔊 다시 듣기</button></div></div><p><button class="primary" onclick="session.i++;session.answered=false;render()">${s.i+1===s.qs.length?'결과 보기':'다음 문제 →'}</button></p>`}

function openSceneDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(Error('IndexedDB 지원 안 됨'));return}let r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('images'))r.result.createObjectStore('images')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function scenePut(id,file){if(!file||!['image/jpeg','image/png','image/gif','image/webp'].includes(file.type)){alert('JPG, PNG, GIF, WebP 이미지를 선택해 주세요.');return}if(file.size>12*1024*1024){alert('12MB 이하 이미지로 선택해 주세요.');return}try{let db=await openSceneDB();await new Promise((res,rej)=>{let tx=db.transaction('images','readwrite');tx.objectStore('images').put(file,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});showSceneImage(id)}catch(e){alert('기기에 이미지 저장을 할 수 없습니다. 저장 공간 또는 브라우저 설정을 확인해 주세요.')}}

let officialSceneCatalog={};
async function loadOfficialSceneCatalog(){
  try{
    const res=await fetch('./scene-catalog.json',{cache:'no-store'});
    if(!res.ok) return;
    const data=await res.json();
    if(data&&data.schema===1&&Array.isArray(data.scenes)){
      officialSceneCatalog={};
      for(const x of data.scenes){
        if(!x||typeof x.id!=='string'||typeof x.image!=='string'||!x.verified||!x.permission)continue;
        const u=validSceneUrl(x.image);
        if(u&&anime.some(a=>a.id===x.id))officialSceneCatalog[x.id]={image:u,source:x.source||'',caption:x.caption||'',license:x.permission};
      }
    }
    if(tab==='anime'&&!session)showSceneImage(animeId);
  }catch(e){console.info('장면 목록은 현재 사용할 수 없습니다.',e)}
}

function animeQuestions(a){
  const base={prompt:a.question,choices:[...a.choices],correct:a.correct,kind:'의미 이해'};
  const meaningful=a.words.filter(w=>w[3]&&w[3].length>1);
  let pick=meaningful[Math.min(meaningful.length-1,1)];
  const other=[...new Set(anime.flatMap(x=>x.words.map(w=>w[3])).filter(t=>t!==pick[3]&&t.length>1))];
  const choices=[pick[3],...other.slice(0,3)];
  const second={prompt:`「${pick[0]}」의 뜻은?`,choices,correct:0,kind:'단어 이해'};
  const third={prompt:'이 문장의 자연스러운 한국어 뜻은?',choices:[a.ko,...[...new Set(anime.filter(x=>x.id!==a.id).map(x=>x.ko))].slice(0,3)],correct:0,kind:'문장 이해'};
  return [base,second,third].map(q=>{const order=shuffle(q.choices.map((label,i)=>({label,correct:i===q.correct})));return {...q,choices:order.map(x=>x.label),correct:order.findIndex(x=>x.correct)}});
}

}
function animeAnswer(i){if(animeAnswered)return;let a=anime.find(x=>x.id===animeId),q=animeQuizSet[animeStep],ok=i===q.correct;animeAnswered=true;

function review(){let due=dueItems(),wrong=Object.values(state.wrong),upcoming=Object.values(state.reviewPlan).filter(x=>x&&x.due>localDay()).length;return `<section class="card"><h1>🧠 스마트 복습</h1><p>오늘 복습할 문제 <strong>${due.length}개</strong> · 다음 복습 예정 ${upcoming}개 · 틀린 문제 ${wrong.length}개</p><p class="muted">정답을 맞히면 1→3→7→14→30일 간격으로 복습해요. 틀리면 오늘 다시 복습할 수 있어요. 알림 기능은 없으며 앱을 열어야 확인할 수 있어요.</p><div class="row"><button class="primary" onclick="startCustom(due.slice(0,20),'오늘의 복습')" ${due.length?'':'disabled'}>오늘 복습 시작 (${Math.min(due.length,20)}문제)</button><button onclick="startDaily()">오늘의 10문제</button></div>${wrong.length?`<h2 style="margin-top:20px">최근 오답</h2><div class="list">${[...new Set(wrong.map(x=>x.lesson))].filter(id=>lessons.some(l=>l.id===id)).map(id=>`<button class="lesson" onclick="start('${id}',true)">${esc(lessons.find(x=>x.id===id)?.title||id)} · ${wrong.filter(x=>x.lesson===id).length}문제 즉시 재도전 →</button>`).join('')}</div>`:'<div class="note" style="margin-top:15px">틀린 문제가 없어요. 잘하고 있어요!</div>'}</section>`}

function settings(){return `<section class="card"><h1>데이터 관리</h1><p>학습 기록은 현재 브라우저에만 저장돼요. 다른 기기에서 이어 하려면 백업 파일을 내보내고 가져오세요.</p><div class="row"><button class="primary" onclick="backup()">⬇ 기록·이미지 함께 백업</button><button onclick="$('importFile').click()">⬆ 기록 복원</button><input class="hide" type="file" accept="application/json" id="importFile" onchange="restore(event)"></div><hr><h3>학습 기록 초기화</h3><p class="muted">초기화하면 현재 브라우저의 모든 진도가 삭제됩니다.</p><button class="danger" onclick="resetData()">기록 초기화</button></section><section class="card"><h2>🔍 앱 상태 확인</h2><div class="list" id="appDiagnostics"><div class="note">상태를 확인하려면 아래 버튼을 눌러 주세요.</div></div><div class="row"><button onclick="runDiagnostics()">🔎 앱 상태 검사</button><button onclick="checkAppUpdate()">🔄 새 버전 확인</button></div><p class="foot">오프라인 저장은 HTTPS로 배포한 뒤 한 번 접속해야 활성화돼요. 다운로드한 HTML 파일만으로는 설치 기능이 작동하지 않을 수 있어요.</p></section><section class="card"><h2>📱 스마트폰에 설치하기</h2><div class="install-help"><p>설치 버튼은 <strong>HTTPS 웹 주소로 배포했을 때</strong> 사용할 수 있어요. 다운로드한 HTML 파일을 직접 열면 설치가 제한될 수 있어요.</p><div class="row"><button id="installPwa" class="primary" onclick="installPwa()" ${installPrompt?"":"disabled"}>📲 앱 설치</button></div><ol><li><strong>안드로이드 Chrome</strong>: 배포 주소 방문 → 오른쪽 상단 ⋮ → 홈 화면에 추가 / 앱 설치</li><li><strong>iPhone Safari</strong>: 배포 주소 방문 → 공유 버튼 → 홈 화면에 추가</li></ol><p class="foot">첫 연결 후 기본 레슨은 오프라인 사용 가능. 외부 이미지·음성은 기기와 인터넷 환경에 영향을 받아요.</p></div><h2>무료 사용 안내</h2><p>광고·계정·서버·유료 AI API 없이 작동하도록 만들었습니다. 음성은 브라우저/운영체제 기능을 사용하며 일본어 음성 지원 여부는 기기에 따라 다릅니다.</p><p class="foot">브라우저 데이터를 삭제하면 기록도 사라질 수 있으니 주기적으로 백업하세요. 로컬 파일에서 일부 PWA 기능이 제한될 수 있습니다. 새 버전의 백업에는 개인 장면 이미지도 포함됩니다. 백업 파일을 다른 곳에 공개하면 이미지와 학습 기록이 함께 노출될 수 있으니 개인적으로 보관하세요.</p></section>`};function downloadJson(data,name){const b=new Blob([JSON.stringify(data)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}

async function backup(){let data={...state,_backupVersion:2,_savedAt:new Date().toISOString(),_scenes:{},_sceneLinks:sceneLinks};try{for(let a of anime){let f=await sceneGet(a.id);if(f)data._scenes[a.id]=await fileAsDataURL(f)}}catch(e){alert('이미지 백업 처리 중 문제가 생겼어요. 학습 기록은 백업합니다.')}downloadJson(data,'nihongo-backup-all.json')}
async function restore(e){const f=e.target.files[0];if(!f)return;try{if(f.size>100*1024*1024)throw Error('파일이 너무 큽니다');const d=JSON.parse(await f.text());if(!Number.isFinite(d.xp)||d.xp<0||!d.completed||typeof d.completed!=='object'||Array.isArray(d.completed)||!d.wrong||typeof d.wrong!=='object'||Array.isArray(d.wrong))throw Error('형식 오류');if(!confirm('현재 기록을 백업 파일로 교체할까요? 가능하면 먼저 현재 기록을 백업해 주세요.'))return;let next={xp:d.xp,completed:d.completed,wrong:d.wrong,history:Array.isArray(d.history)?d.history.slice(-2500):[],solved:d.solved&&typeof d.solved==='object'?d.solved:{},animeDone:d.animeDone&&typeof d.animeDone==='object'?d.animeDone:{},reviewPlan:d.reviewPlan&&typeof d.reviewPlan==='object'?d.reviewPlan:{}};let count=0;if(d._scenes&&typeof d._scenes==='object'){let db=await openSceneDB();for(const a of anime){const data=d._scenes[a.id];if(typeof data!=='string'||!/^data:image\/(png|jpeg|gif|webp);base64,/.test(data))continue;const response=await fetch(data);const blob=await response.blob();if(blob.size>12*1024*1024)continue;await new Promise((resolve,reject)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put(blob,a.id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});count++}}if(d._sceneLinks&&typeof d._sceneLinks==='object'&&!Array.isArray(d._sceneLinks)){sceneLinks={};for(const a of anime){const url=validSceneUrl(d._sceneLinks[a.id]||'');if(url)sceneLinks[a.id]=url}localStorage.setItem(SCENE_LINK_KEY,JSON.stringify(sceneLinks))}state=next;save();render();alert(`학습 기록 복원 완료! 장면 이미지 ${count}개 복원했어요.`)}catch(err){console.error(err);alert('백업 파일을 복원하지 못했어요. 형식과 저장 용량을 확인해 주세요.')}finally{e.target.value=''}};

  let cacheInfo='미지원';
  if('caches' in window){try{const names=await caches.keys();cacheInfo=names.some(n=>n.startsWith('nihongo-hanip-'))?'기본 자료 캐시 발견':'기본 자료 캐시 없음'}catch{cacheInfo='확인 실패'}}
  let storage='확인 불가';try{const k='nihongo-test-'+Date.now();localStorage.setItem(k,'1');storage=localStorage.getItem(k)==='1'?'학습 기록 저장 가능':'저장 오류';localStorage.removeItem(k)}catch{storage='저장 차단됨'}
  const sw=('serviceWorker' in navigator)&&navigator.serviceWorker.controller?'앱 제어 중':('serviceWorker' in navigator?'등록 대기 또는 로컬 실행':'미지원');
  const rows=[['실행 환경',secure?'설치 가능 주소(HTTPS 또는 localhost)':'로컬 파일/비보안 접속 — 설치 제한'],['설치 상태',installed?'홈 화면 앱으로 실행 중':'브라우저에서 실행 중'],['학습 기록',storage],['서비스 워커',sw],['오프라인 캐시',cacheInfo],['일본어 음성','speechSynthesis' in window?'브라우저 합성 기능 지원 (일본어 음성 품질 별도)':'지원하지 않음']];
  host.innerHTML=rows.map(([name,val])=>`<div class="learning-row"><strong>${esc(name)}</strong><span class="helper">${esc(val)}</span></div>`).join('');
}
async function checkAppUpdate(){
  if(!('serviceWorker' in navigator)){alert('이 브라우저에서는 앱 업데이트 검사가 지원되지 않습니다.');return}
  try{const r=await navigator.serviceWorker.getRegistration();if(!r){alert('아직 설치된 서비스 워커가 없습니다. HTTPS 주소로 접속했는지 확인해 주세요.');return}
    await r.update();alert('업데이트 확인을 요청했어요. 새 버전이 있으면 다음에 앱을 열 때 적용될 수 있어요.');
  }catch{alert('업데이트 확인에 실패했어요. 인터넷 연결을 확인해 주세요.')}
}
